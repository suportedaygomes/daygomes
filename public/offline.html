<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070a" />
    <title>Sem conexão · Day Gomes</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        background: #07070a;
        color: #f6f3ef;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main { width: min(100%, 28rem); text-align: center; }
      img { width: min(100%, 16rem); height: auto; }
      h1 { margin: 0.5rem 0 0; font-size: 1.8rem; }
      p { color: #b7b1aa; line-height: 1.6; }
      button {
        height: 3.25rem;
        width: 100%;
        border: 0;
        border-radius: 1rem;
        background: #8e3ebe;
        color: white;
        font: inherit;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Day Gomes" />
      <h1>Sem conexão</h1>
      <p>Não foi possível abrir o Day Gomes agora. Confira a internet e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
