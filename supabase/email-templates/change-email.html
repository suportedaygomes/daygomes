<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="supported-color-schemes" content="dark" />
  <title>Confirmar novo e-mail — Day Gomes</title>
  <style>
    :root { color-scheme: dark; supported-color-schemes: dark; }
    body, table, td { background-color: #07070a !important; }
  </style>
</head>
<body bgcolor="#07070a" style="margin:0;padding:0;background-color:#07070a;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#07070a" style="background-color:#07070a;">
    <tr>
      <td align="center" bgcolor="#07070a" style="padding:32px 16px 40px;background-color:#07070a;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;">
          <tr>
            <td align="center" bgcolor="#07070a" style="padding-bottom:24px;background-color:#07070a;">
              <img src="https://daygomes.com.br/logoday.png" width="336" height="223" alt="Day Gomes" style="display:block;margin:0 auto;border:0;outline:none;text-decoration:none;width:336px;max-width:100%;height:auto;" />
            </td>
          </tr>
          <tr>
            <td bgcolor="#16161c" style="background-color:#16161c;border:1px solid #2a2a32;border-radius:16px;padding:32px 28px;">
              <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#ab5fd0;">Segurança da conta</p>
              <h1 style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#f6f3ef;">Confirmar novo e-mail</h1>
              <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#b7b1aa;">
                Você pediu para alterar o e-mail da sua conta Day Gomes. Confirme o novo endereço clicando no botão abaixo.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;">
                <tr>
                  <td align="center" style="border-radius:10px;background-color:#8e3ebe;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Confirmar alteração</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#8a847d;">
                Se você não solicitou esta mudança, ignore este e-mail e entre em contato conosco.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#07070a" style="padding-top:24px;background-color:#07070a;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6f6a64;">
              <a href="mailto:acesso@daygomes.com.br" style="color:#ab5fd0;text-decoration:none;">acesso@daygomes.com.br</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
