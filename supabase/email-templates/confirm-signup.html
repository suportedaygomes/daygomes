<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>Confirme seu e-mail — Professora Day Gomes</title>
  <style>
    :root { color-scheme: light; supported-color-schemes: light; }
    body, table, td { background-color: #f5f3ef !important; }
  </style>
</head>
<body bgcolor="#f5f3ef" style="margin:0;padding:0;background-color:#f5f3ef;-webkit-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f5f3ef" style="background-color:#f5f3ef;">
    <tr>
      <td align="center" bgcolor="#f5f3ef" style="padding:32px 16px 40px;background-color:#f5f3ef;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;">
          <tr>
            <td align="center" bgcolor="#f5f3ef" style="padding-bottom:24px;background-color:#f5f3ef;">
              <img src="https://daygomes.com.br/logonova-email.png" width="336" height="137" alt="Professora Day Gomes" style="display:block;margin:0 auto;border:0;outline:none;text-decoration:none;width:336px;max-width:100%;height:auto;" />
            </td>
          </tr>
          <tr>
            <td bgcolor="#ffffff" style="background-color:#ffffff;border:1px solid #e5e2dc;border-radius:16px;padding:32px 28px;">
              <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#7a32a8;">Bem-vindo(a)</p>
              <h1 style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#121216;">Confirme seu e-mail</h1>
              <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#5f5a54;">
                Falta só um passo para ativar sua conta no Professora Day Gomes. Clique no botão para confirmar que este endereço de e-mail é seu.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;">
                <tr>
                  <td align="center" style="border-radius:10px;background-color:#8e3ebe;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Confirmar e-mail</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#5f5a54;">
                Se você não criou uma conta, pode ignorar esta mensagem.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#f5f3ef" style="padding-top:24px;background-color:#f5f3ef;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#5f5a54;">
              Professora Day Gomes · <a href="https://daygomes.com.br/login" style="color:#7a32a8;text-decoration:none;">Entrar na plataforma</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
