<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Confirme seu e-mail — Day Gomes</title>
</head>
<body style="margin:0;padding:0;background-color:#07070a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#07070a;background-image:radial-gradient(600px 320px at 15% 0%, rgba(171,95,208,0.22), transparent 55%);">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;">
          <tr>
            <td align="center" style="padding-bottom:28px;">
              <img src="https://daygomes.com.br/logoday.png" width="168" alt="Day Gomes" style="display:block;border:0;height:auto;max-width:168px;" />
            </td>
          </tr>
          <tr>
            <td style="background-color:#16161c;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:32px 28px;">
              <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#ab5fd0;">Bem-vindo(a)</p>
              <h1 style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#f6f3ef;">Confirme seu e-mail</h1>
              <p style="margin:0 0 24px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#b7b1aa;">
                Falta só um passo para ativar sua conta no Day Gomes. Clique no botão para confirmar que este endereço de e-mail é seu.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 24px;">
                <tr>
                  <td align="center" style="border-radius:10px;background-color:#8e3ebe;">
                    <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;">Confirmar e-mail</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#8a847d;">
                Se você não criou uma conta, pode ignorar esta mensagem.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding-top:24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6f6a64;">
              Day Gomes · <a href="https://daygomes.com.br/login" style="color:#ab5fd0;text-decoration:none;">Entrar na plataforma</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
